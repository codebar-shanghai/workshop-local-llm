<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Mario - One Short Level</title>
<style>
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #1a1a2e;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: monospace;
    user-select: none;
  }
  h1 { color: #e94560; margin: 8px 0; letter-spacing: 4px; text-shadow: 0 0 12px #e94560; }
  #wrap { position: relative; width: 800px; }
  canvas {
    display: block;
    border: 4px solid #222;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(0,0,0,.6);
  }
  #hud {
    position: absolute; top: 8px; left: 14px; right: 14px;
    display: flex; justify-content: space-between;
    color: #fff; font-size: 18px; font-weight: bold;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
  }
  #overlay {
    position: absolute; inset: 4px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.6);
    color: #fff;
    border-radius: 6px;
  }
  #overlay h2 { font-size: 40px; margin: 10px 0; text-shadow: 0 0 16px #e94560; }
  #overlay p { font-size: 18px; margin: 4px; }
  #overlay button {
    margin-top: 16px; padding: 10px 28px;
    font-family: monospace; font-size: 18px; font-weight: bold;
    background: #e94560; color: #fff; border: 0; border-radius: 6px;
    cursor: pointer; box-shadow: 0 4px 0 #8f1d2f;
  }
  #overlay button:active { transform: translateY(2px); box-shadow: 0 2px 0 #8f1d2f; }
  .hidden { display: none !important; }
  #hint { color: #ccc; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<h1>SUPER MARIO &mdash; WORLD 1-1 (short)</h1>
<div id="wrap">
  <canvas id="game" width="800" height="480"></canvas>
  <div id="hud"><span id="hudL"></span><span id="hudR"></span></div>
  <div id="overlay">
    <h2 id="ovTitle">WORLD 1-1</h2>
    <p id="ovMsg">Reach the flag to win!</p>
    <p>&larr; &rarr; / A D = move &nbsp;|&nbsp; Space / &uarr; / W = jump</p>
    <button id="startBtn">START</button>
  </div>
</div>
<div id="hint">Stomp goombas, grab coins, don't fall in the pits. R = restart, P = pause.</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const hudL = document.getElementById("hudL");
const hudR = document.getElementById("hudR");
const overlay = document.getElementById("overlay");
const ovTitle = document.getElementById("ovTitle");
const ovMsg = document.getElementById("ovMsg");
const startBtn = document.getElementById("startBtn");

const W = canvas.width, H = canvas.height;
const TILE = 32;
const GRAVITY = 0.55;
const MAX_FALL = 12;
const MOVE_ACC = 0.5;
const MAX_RUN = 3.6;
const JUMP_VEL = -11.2;
const ROWS = H / TILE; // 15 rows

// ---------- Level (procedurally built, one short level) ----------
// Rows 12..14 are the ground. Pits, pipes, blocks and enemies are placed below.
function buildLevel() {
  const cols = 88;
  const g = Array.from({length: ROWS}, () => new Array(cols).fill(" "));
  const put = (x, y, ch) => { if (x >= 0 && x < cols && y >= 0 && y < ROWS) g[y][x] = ch; };

  // Ground: solid from col 0..79, pit at 30..34 and 62..65, solid to end
  for (let x = 0; x < cols; x++) {
    if ((x >= 31 && x <= 33) || (x >= 62 && x <= 64)) continue; // pits
    for (let y = 12; y < ROWS; y++) put(x, y, "X");
  }

  // Question blocks with coins (row 8)
  for (let x = 14; x <= 17; x++) put(x, 8, "Q");
  // Stairs before flag
  for (let i = 1; i < 4; i++)
    for (let y = 11; y >= 12 - i; y--) put(72 + i, y, "X");

  // Pipes
  put(42, 11, "P"); put(43, 11, "P");
  put(42, 10, "P"); put(43, 10, "P");

  // Flagpole at col 82
  for (let y = 4; y <= 11; y++) put(82, y, "F");

  // Goombas
  const enemies = [
    { x: 22, y: 11 }, { x: 38, y: 11 }, { x: 50, y: 11 }, { x: 52, y: 11 }, { x: 70, y: 11 },
  ];

  // Coins (floating)
  const coins = [
    { x: 31.5, y: 9 }, { x: 32.5, y: 9 }, { x: 63.5, y: 9 }, { x: 64.5, y: 9 },
    { x: 76.5, y: 6 }, { x: 77.5, y: 6 },
  ];

  return { g, enemies, coins, flag: { x: 82, y: 11 } };
}

// ---------- State ----------
let grid, enemies, coins, flag, score, coinsGot, lives, mario, camX, state, timer, particles, invuln, timeLeft, tick;
const keys = {};

function reset() {
  const L = buildLevel();
  grid = L.g; enemies = L.enemies.map(e => ({x: e.x * TILE, y: e.y * TILE, vx: 0, vy: 0, w: 26, h: 26, alive: true, squash: 0}));
  coins = L.coins.map(c => ({x: c.x * TILE, y: c.y * TILE, t: Math.random() * 10}));
  flag = L.flag; score = 0; coinsGot = 0; lives = 3; timeLeft = 120; tick = 0; invuln = 0;
  camX = 0;
  mario = { x: 1.5 * TILE, y: 11 * TILE, vx: 0, vy: 0, w: 24, h: 30, onGround: false, face: 1 };
  particles = [];
  state = "playing";
}

function solidAt(px, py) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (tx < 0 || tx >= grid[0].length || ty < 0 || ty >= ROWS) return ty >= ROWS;
  const c = grid[ty][tx];
  return c === "X" || c === "B" || c === "Q" || c === "P" || c === "F";
}

function rectSolid(r) {
  return solidAt(r.x, r.y) || solidAt(r.x + r.w - 1, r.y) ||
         solidAt(r.x, r.y + r.h - 1) || solidAt(r.x + r.w - 1, r.y + r.h - 1);
}

function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function moveEntity(e) {
  // horizontal
  e.x += e.vx;
  if (rectSolid(e)) {
    if (e.vx > 0) e.x = Math.floor((e.x + e.w) / TILE) * TILE - e.w - 0.01;
    else e.x = Math.floor(e.x / TILE) * TILE + TILE;
    e.vx = 0;
  }
  // vertical
  e.y += e.vy;
  let landed = false;
  if (rectSolid(e)) {
    if (e.vy > 0) { e.y = Math.floor((e.y + e.h) / TILE) * TILE - e.h - 0.01; landed = true; }
    else { e.y = Math.floor(e.y / TILE) * TILE + TILE; }
    e.vy = 0;
  }
  return landed;
}

function spawnParticle(x, y, color, n) {
  for (let i = 0; i < (n || 6); i++)
    particles.push({ x, y, vx: (Math.random() - .5) * 5, vy: -Math.random() * 6 - 2, life: 30, color });
}

function die() {
  lives--;
  if (lives <= 0) { showEnd("GAME OVER", "Try again!", "RESTART", start); return; }
  reset();
  score = Math.floor(score / 2);
  showEnd("OUCH!", `${lives} ${lives === 1 ? "life" : "lives"} left`, "CONTINUE", resume);
}

function showEnd(title, msg, btn, fn) {
  state = "over";
  ovTitle.textContent = title;
  ovMsg.textContent = msg;
  startBtn.textContent = btn;
  startBtn.onclick = fn;
  overlay.classList.remove("hidden");
}

function win() {
  score += timeLeft * 10;
  showEnd("COURSE CLEAR!", `Score: ${score}  Coins: ${coinsGot}`, "PLAY AGAIN", start);
}

// ---------- Update ----------
function update() {
  if (state !== "playing") return;
  tick++;
  timeLeft = Math.max(0, 120 - Math.floor(tick / 60));
  if (timeLeft === 0) die();

  const m = mario;
  const left = keys.ArrowLeft || keys.a || keys.A;
  const right = keys.ArrowRight || keys.d || keys.D;
  const jump = keys[" "] || keys.ArrowUp || keys.w || keys.W;

  if (left) { m.vx -= MOVE_ACC; m.face = -1; }
  else if (right) { m.vx += MOVE_ACC; m.face = 1; }
  else m.vx *= 0.8;
  m.vx = Math.max(-MAX_RUN, Math.min(MAX_RUN, m.vx));
  if (Math.abs(m.vx) < 0.05) m.vx = 0;

  if (jump && m.onGround) { m.vy = JUMP_VEL; m.onGround = false; }

  m.vy = Math.min(MAX_FALL, m.vy + GRAVITY);
  m.onGround = moveEntity(m);
  if (m.onGround) m.onGround = true;

  // fell in a pit
  if (m.y > H + 40) { invuln = -1; die(); return; }

  // coins
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    if (overlap(m, { x: c.x - 8, y: c.y - 8, w: 16, h: 16 })) {
      coins.splice(i, 1);
      score += 200; coinsGot++;
      spawnParticle(c.x, c.y, "#ffe066", 8);
    }
  }

  // goombas
  for (const e of enemies) {
    if (!e.alive) { if (e.squash > 0) e.squash--; continue; }
    e.vy = Math.min(MAX_FALL, e.vy + GRAVITY);
    // walk left, flip if blocked by a wall
    e.vx = -1;
    moveEntity(e);
    if (e.vx === 0) e.vx = 1;
    if (e.y > H + 40) e.alive = false;

    if (invuln <= 0 && overlap(m, e)) {
      if (m.vy > 0 && m.y + m.h - e.y < 18) {
        e.alive = false; e.squash = 25;
        m.vy = -8;
        score += 100;
        spawnParticle(e.x + e.w / 2, e.y, "#8b5a2b", 6);
      } else { die(); return; }
    }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (invuln > 0) invuln--;

  // flag
  const fx = flag.x * TILE + 16;
  if (m.x + m.w > fx - 6 && Math.abs(m.y + m.h - (flag.y * TILE)) < 40) win();

  // camera
  camX = Math.max(0, Math.min(m.x - W / 3, grid[0].length * TILE - W));

  hudL.textContent = `SCORE ${String(score).padStart(6, "0")}  COINS x${coinsGot}  LIVES ${lives}`;
  hudR.textContent = `TIME ${timeLeft}`;
}

// ---------- Draw ----------
function drawBg() {
  ctx.fillStyle = "#5c94fc";
  ctx.fillRect(0, 0, W, H);
  // clouds
  ctx.fillStyle = "rgba(255,255,255,.9)";
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 190 + 40) - camX * 0.4) % (W + 200);
    const x = (cx + W + 200) % (W + 200) - 100;
    const y = 40 + (i % 3) * 30;
    cloud(x, y);
  }
  // hills
  ctx.fillStyle = "#3a7d44";
  for (let i = 0; i < 5; i++) {
    const hx = i * 300 - (camX * 0.7 % 300);
    hill(hx, 170); hill(hx + 150, 130);
  }
}

function cloud(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 16, 0, 7); ctx.arc(x + 20, y - 8, 18, 0, 7); ctx.arc(x + 42, y, 16, 0, 7);
  ctx.fill();
}

function hill(x, s) {
  ctx.beginPath();
  ctx.moveTo(x, 480); ctx.quadraticCurveTo(x + s / 2, 480 - s, x + s, 480);
  ctx.fill();
}

function drawTiles() {
  const c0 = Math.max(0, Math.floor(camX / TILE) - 1);
  const c1 = Math.min(grid[0].length, Math.ceil((camX + W) / TILE) + 1);
  for (let x = c0; x < c1; x++) for (let y = 0; y < ROWS; y++) {
    const ch = grid[y][x];
    if (ch === " " || ch === "F") continue;
    const sx = x * TILE - camX, sy = y * TILE;
    if (ch === "X") {
      ctx.fillStyle = "#b58b4e";
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = "#8a6530";
      ctx.fillRect(sx, sy + TILE - 6, TILE, 6);
      ctx.fillRect(sx, sy, 4, TILE);
      ctx.fillStyle = "#d9b380";
      ctx.fillRect(sx + 4, sy, TILE - 4, 4);
    } else if (ch === "Q") {
      ctx.fillStyle = "#e9a820";
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.strokeStyle = "#a06b00"; ctx.lineWidth = 3;
      ctx.strokeRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = "#fff"; ctx.font = "bold 20px monospace"; ctx.textAlign = "center";
      ctx.fillText("?", sx + TILE / 2, sy + 23);
    } else if (ch === "P") {
      ctx.fillStyle = "#2e8b2e";
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = "#1f6b1f";
      ctx.fillRect(sx, sy, 5, TILE);
      ctx.fillStyle = "#58c158";
      ctx.fillRect(sx + 5, sy, 5, TILE);
    }
  }
  // flagpole
  const fx = flag.x * TILE + 16 - camX;
  if (fx > -20 && fx < W + 20) {
    ctx.strokeStyle = "#ccc"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(fx, flag.y * TILE - TILE); ctx.lineTo(fx, flag.y * TILE + TILE); ctx.stroke();
    ctx.fillStyle = "#e94560";
    ctx.beginPath();
    ctx.moveTo(fx, flag.y * TILE - TILE);
    ctx.lineTo(fx - 30, flag.y * TILE - TILE + 10);
    ctx.lineTo(fx, flag.y * TILE + TILE - 14);
    ctx.fill();
    // base block
    ctx.fillStyle = "#b58b4e";
    ctx.fillRect(flag.x * TILE - camX, (flag.y + 1) * TILE, TILE, TILE);
  }
}

function drawCoins() {
  for (const c of coins) {
    const sx = c.x - camX, sy = c.y + Math.sin(c.t * 0.1) * 3;
    ctx.fillStyle = "#ffe066";
    ctx.beginPath(); ctx.ellipse(sx + 8, sy + 8, 8, 11, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#c9971b"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(sx + 8, sy + 8, 5, 7, 0, 0, 7); ctx.stroke();
  }
}

function drawGoombas() {
  for (const e of enemies) {
    if (!e.alive) { if (e.squash > 0) {
      ctx.fillStyle = "#8b5a2b";
      ctx.fillRect(e.x - camX, e.y + e.h - 8, e.w, 8);
    } continue; }
    const sx = e.x - camX, sy = e.y;
    ctx.fillStyle = "#a05a1e";
    ctx.beginPath(); ctx.arc(sx + e.w / 2, sy + e.h / 2 - 2, e.w / 2, 0, 7); ctx.fill();
    ctx.fillStyle = "#5c3a10";
    ctx.fillRect(sx + 3, sy + e.h - 6, 8, 6);
    ctx.fillRect(sx + e.w - 11, sy + e.h - 6, 8, 6);
    ctx.fillStyle = "#fff";
    ctx.fillRect(sx + 5, sy + 6, 5, 6); ctx.fillRect(sx + e.w - 10, sy + 6, 5, 6);
  }
}

function drawMario() {
  const m = mario;
  if (invuln > 0 && (tick >> 2) % 2 === 0 && invuln > 2) return; // skip (kept simple: no blink)
  const sx = m.x - camX, sy = m.y;
  const run = Math.abs(m.vx) > 0.5 && m.onGround;
  const leg = run ? Math.sin(tick * 0.4) * 4 : 0;
  // body
  ctx.fillStyle = "#e94560";
  ctx.fillRect(sx, sy + 8, m.w, 12);
  // head
  ctx.fillStyle = "#ffcc99";
  ctx.fillRect(sx + 4, sy, 16, 10);
  // cap
  ctx.fillStyle = "#e94560";
  ctx.fillRect(sx + 2, sy - 2, 20, 5);
  ctx.fillRect(sx + (m.face > 0 ? 12 : 0), sy - 2, 12, 3);
  // eyes
  ctx.fillStyle = "#222";
  ctx.fillRect(sx + (m.face > 0 ? 15 : 6), sy + 3, 3, 4);
  // overalls
  ctx.fillStyle = "#2255cc";
  ctx.fillRect(sx + 2, sy + 20, m.w - 4, 8);
  // legs
  ctx.fillRect(sx + 2, sy + 26, 8, 4 + (leg > 0 ? leg : 0));
  ctx.fillRect(sx + m.w - 10, sy + 26, 8, 4 + (leg < 0 ? -leg : 0));
}

function drawParticles() {
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - camX - 2, p.y - 2, 4, 4);
  }
}

function render() {
  drawBg();
  drawTiles();
  drawCoins();
  drawGoombas();
  drawMario();
  drawParticles();
}

// ---------- Loop ----------
let last = 0;
function frame(ts) {
  const dt = Math.min(50, ts - last); last = ts;
  update();
  if (state === "playing" || state === "over") render();
  requestAnimationFrame(frame);
}

// ---------- Input ----------
window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
  if ((e.key === "r" || e.key === "R") && state === "playing") { reset(); }
  if ((e.key === "p" || e.key === "P") && state === "playing") {
    state = "paused";
    showEnd("PAUSED", "Press P to resume", "RESUME", resume);
  } else if ((e.key === "p" || e.key === "P") && state === "paused") {
    resume();
  }
});
window.addEventListener("keyup", e => { delete keys[e.key]; });

function resume() { state = "playing"; overlay.classList.add("hidden"); }
function start() { reset(); overlay.classList.add("hidden"); }
startBtn.onclick = start;

reset();
showEnd("WORLD 1-1", "Reach the flag to win!", "START", start);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
