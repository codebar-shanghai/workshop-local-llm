    <style>
.reveal .slides section p img {
  border: 4px solid transparent;
  border-radius: 16px;
  background:
    linear-gradient(#0000, #0000) padding-box,
    linear-gradient(-45deg, #743ad5, #d53a9d) border-box;
}

.reveal .slides section pre code {
  padding: 16px;
  border: 2px solid;
  border-image: linear-gradient(-45deg, #743ad5, #d53a9d) 1;
}

.reveal .slides p {
  text-align: left;
  margin-left: 2em;
  margin-right: 2em;
}

.reveal .slides section.present div.docker-list ul > li > a:not(.link-checksum) {
  font-size: 0.8em;
}

.reveal .slides a.link-checksum {
  display: inline-flex;
  aligh-items: center;
  font-size: 0.4em;
  line-height: 1;

  padding: 0.15em 0.4em;
  border: 1px solid currentColor;
  border-radius: 0.3em;

  vertical-align: middle;
  color: #8be9fd;
}
.reveal .slides a.link-checksum:hover {
  color: #bd93f9;
}
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="slides.md"
          data-separator="^\n\n\n"
          data-separator-vertical="^\n\n"
          data-separator-notes="^Note:"
          data-charset="UTF-8"
        >
        </section>
      </div>
    </div>
    <script src="https://unpkg.com/reveal.js@6.0.0/dist/reveal.js"></script>
    <script src="https://unpkg.com/reveal.js@6.0.0/dist/plugin/markdown.js"></script>
    <script src="https://unpkg.com/reveal.js@6.0.0/dist/plugin/notes.js"></script>
    <script>
      Reveal.initialize({
        plugins: [
          RevealMarkdown,
          RevealNotes,
        ],
        slideNumber: true,
        hash: true,
        hashOneBasedIndex: true,
      });
    </script>
  </body>
